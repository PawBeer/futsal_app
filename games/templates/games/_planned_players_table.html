{% load player_extras %}
<div class="divide-y divide-base-200">
    <div class="bg-base-200 px-6 py-4 rounded-t-xl">
        <h3 class="text-xl font-semibold text-base-content text-center">Planned Players</h3>
    </div>
    <div class="overflow-x-auto rounded-b-xl">
        <table class="table w-full [&_th]:px-2 [&_td]:px-2">
            <thead>
            <tr>
                <th class="w-16 text-center whitespace-normal break-words font-semibold text-base-content/70 uppercase tracking-wide">{% if game.status == 'Played' %}Confirm Payment{% else %}Play{% endif %}</th>
                <th class="w-24 text-left font-semibold text-base-content/70 uppercase tracking-wide">Player</th>
                <th class="w-24 text-center font-semibold text-base-content/70 uppercase tracking-wide">Substitute</th>
                {% if game.status == 'Played' %}
                    <th class="w-16 text-center font-semibold text-base-content/70 uppercase tracking-wide">Paid</th>
                    <th class="w-24 text-center whitespace-normal break-words font-semibold text-base-content/70 uppercase tracking-wide">Status</th>
                {% endif %}
            </tr>
            </thead>
            <tbody>
            {% for row in planned_players_rows %}
                {% include row.template %}
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
