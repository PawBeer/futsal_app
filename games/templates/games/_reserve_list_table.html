{% load player_extras %}
{% if user.is_superuser or player_should_see_reserved_table %}
    <div class="divide-y divide-base-200">
        <div class="bg-base-200 px-6 py-4 rounded-t-xl">
            <h3 class="text-xl font-semibold text-base-content text-center">Reserve List</h3>
        </div>
        <div class="overflow-x-auto rounded-b-xl">
            <table class="table w-full">
                <thead>
                <tr>
                    <th class="w-20 text-center font-semibold text-base-content/70 uppercase tracking-wide">
                        Play
                    </th>
                    <th class="w-64 text-left font-semibold text-base-content/70 uppercase tracking-wide">
                        Player
                    </th>
                </tr>
                </thead>
                <tbody>
                {% for row in reserve_list_rows %}
                    {% include row.template %}
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endif %}
