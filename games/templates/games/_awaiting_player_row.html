{% load player_extras %}
{% with awaiting_player=row.player %}
    <form method="post" action="{% url 'game_player_status_update_url' game_id=game.id %}">
        {% csrf_token %}
        <tr class="hover bg-success/10">
            <td class="text-center py-3">

                {% if user.is_superuser or awaiting_player.user.username == user.username %}
                    <input type="hidden" name="player_id" value="{{ awaiting_player.pk }}">
                    <input type="hidden" name="checked" value="off">
                    <input type="checkbox"
                           name="checked"
                           value="on"
                           id="play_slot_{{ awaiting_player.pk }}"
                           class="toggle toggle-primary"
                           checked
                           onchange="this.form.submit()">
                {% else %}
                    <div style="width: 64px; height: 24px;"></div>
                {% endif %}
            </td>
            <td class="font-medium py-3 flex items-center gap-2">
                <a href="{% url 'player_details_url' player_id=awaiting_player.pk %}"
                   class="link text-base-content flex-1">
                    {{ awaiting_player|get_display_name }}
                </a>
                <span class="badge badge-error">Awaiting</span>
            </td>

            </td>
        </tr>
    </form>
{% endwith %}
